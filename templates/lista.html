<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>{{ titulo }}</h1>
        <ul class="atividade-list">
            {% for atividade in atividades %}
                <li>{{ atividade }}</li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('index') }}" class="button back">Voltar ao Menu</a>
    </div>
</body>
</html>
